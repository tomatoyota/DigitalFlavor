<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Furniture Placement</title>
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.3/aframe/build/aframe-ar.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
        
        <!-- 光源 -->
        <a-light type="ambient" color="#ffffff"></a-light>
        <a-light type="point" intensity="1" position="0 4 0"></a-light>

        <!-- 3D家具模型 -->
        <a-entity
            gltf-model="monk_character.glb"
            position="0 0 -0.5"
            scale="0.5 0.5 0.5"
            rotation="0 45 0"
            ar-hit-test
            draggable
            rotatable
            gesture-handler>
        </a-entity>

        <!-- AR Marker -->
        <!-- <a-marker-camera preset="hiro"></a-marker-camera> -->
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
</body>
</html>
